<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutrify | Sign In</title>
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eff6ff, #dbeafe, #ffffff);
        padding: 24px;
      }
      .auth-container {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(37, 99, 235, 0.15);
      }
      .auth-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .auth-logo img {
        width: 36px;
        height: 36px;
        object-fit: contain;
      }
      .auth-logo span {
        font-size: 1.5rem;
        font-weight: 800;
        color: #1e293b;
      }
      .auth-logo span b {
        color: #2563eb;
      }
      .auth-subtitle {
        text-align: center;
        color: #6b7280;
        margin-bottom: 24px;
        font-size: 0.92rem;
      }
      .tab-row {
        display: flex;
        background: #f1f5f9;
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 24px;
      }
      .tab-btn {
        flex: 1;
        padding: 10px 0;
        border: none;
        border-radius: 9px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        color: #6b7280;
        transition: all 0.25s ease;
      }
      .tab-btn.active {
        background: #ffffff;
        color: #1f2937;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
      }
      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s ease;
      }
      .form-group input:focus {
        border-color: #2563eb;
      }
      .btn-primary {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .btn-primary:hover {
        background: #1d4ed8;
      }
      .btn-primary:disabled {
        background: #93c5fd;
        cursor: not-allowed;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 22px 0;
        color: #9ca3af;
        font-size: 0.82rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e7eb;
      }
      .btn-google {
        width: 100%;
        padding: 13px;
        background: #ffffff;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #374151;
        transition: border-color 0.2s ease;
      }
      .btn-google:hover {
        border-color: #2563eb;
      }
      .message {
        text-align: center;
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 18px;
        font-size: 0.85rem;
        font-weight: 500;
        display: none;
      }
      .message.error {
        background: #fef2f2;
        color: #dc2626;
        display: block;
      }
      .message.success {
        background: #f0fdf4;
        color: #16a34a;
        display: block;
      }
      .message.info {
        background: #eff6ff;
        color: #2563eb;
        display: block;
      }
      .form-group.hidden {
        display: none;
      }
      .auth-footer {
        text-align: center;
        margin-top: 22px;
        font-size: 0.8rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-logo">
        <img src="/static/logo.png" alt="Nutrify" />
        <span>Nutri<b>fy</b></span>
      </div>
      <p class="auth-subtitle" id="authSubtitle">Create your account</p>

      <div class="tab-row">
        <button
          class="tab-btn active"
          id="tabSignUp"
          onclick="switchTab('signup')"
        >
          Sign Up
        </button>
        <button class="tab-btn" id="tabSignIn" onclick="switchTab('signin')">
          Sign In
        </button>
      </div>

      <div class="message" id="message"></div>

      <form id="signupForm" autocomplete="off">
        <div class="form-group" id="fullNameGroup">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe" />
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Min 8 chars"
          />
        </div>
        <button type="submit" class="btn-primary" id="btnSignUp">
          Create Account
        </button>
      </form>

      <form id="signinForm" style="display: none" autocomplete="off">
        <div class="form-group">
          <label for="signinEmail">Email</label>
          <input type="email" id="signinEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="signinPassword">Password</label>
          <input
            type="password"
            id="signinPassword"
            placeholder="Your password"
          />
        </div>
        <button type="submit" class="btn-primary" id="btnSignIn">
          Sign In
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <button class="btn-google" id="btnGoogle">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
        <span>Sign in with Google</span>
      </button>

      <p class="auth-footer">Nutrify — AI-Powered Food Intelligence</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      (function () {
        const SUPABASE_URL = "https://idcwtdasaglfqaefojbd.supabase.co";
        const SUPABASE_ANON_KEY =
          "sb_publishable_CoUgdv_3fBdLMT_5kJGs8Q__CgZjgh2";
        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        const messageEl = document.getElementById("message");
        const signupForm = document.getElementById("signupForm");
        const signinForm = document.getElementById("signinForm");
        const btnSignUp = document.getElementById("btnSignUp");
        const btnSignIn = document.getElementById("btnSignIn");
        const btnGoogle = document.getElementById("btnGoogle");

        function showMessage(text, type) {
          messageEl.textContent = text;
          messageEl.className = "message " + type;
          messageEl.style.display = "block";
        }
        function hideMessage() {
          messageEl.className = "message";
          messageEl.style.display = "none";
          messageEl.textContent = "";
        }

        window.switchTab = function (tab) {
          if (tab === "signup") {
            document.getElementById("tabSignUp").classList.add("active");
            document.getElementById("tabSignIn").classList.remove("active");
            signupForm.style.display = "block";
            signinForm.style.display = "none";
            document.getElementById("fullNameGroup").classList.remove("hidden");
            document.getElementById("authSubtitle").textContent =
              "Create your account";
          } else {
            document.getElementById("tabSignIn").classList.add("active");
            document.getElementById("tabSignUp").classList.remove("active");
            signinForm.style.display = "block";
            signupForm.style.display = "none";
            document.getElementById("fullNameGroup").classList.add("hidden");
            document.getElementById("authSubtitle").textContent =
              "Welcome back";
          }
          hideMessage();
        };

        signupForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          hideMessage();
          const email = document.getElementById("signupEmail").value.trim();
          const password = document.getElementById("signupPassword").value;
          const fullName = document.getElementById("signupName").value.trim();

          if (!email || !password || !fullName) {
            showMessage("Please fill in all fields.", "error");
            return;
          }
          if (password.length < 8) {
            showMessage("Password must be at least 8 characters.", "error");
            return;
          }

          btnSignUp.disabled = true;
          btnSignUp.textContent = "Creating...";

          const { data: authData, error: authError } =
            await supabase.auth.signUp({
              email,
              password,
              options: { data: { full_name: fullName } },
            });

          if (authError) {
            let msg = authError.message;
            if (
              authError.error_code === "over_email_send_rate_limit" ||
              /rate\s*limit/i.test(msg)
            ) {
              msg =
                "Too many signup emails were sent from this project. Please wait up to an hour and try again.";
            }
            showMessage(msg, "error");
            btnSignUp.disabled = false;
            btnSignUp.textContent = "Create Account";
            return;
          }

          if (authData.user) {
            // Best-effort: if a session was issued immediately (email
            // confirmations disabled), make sure the profile row exists.
            // Never block account creation on this — a database trigger on
            // auth.users already creates the profile server-side.
            if (authData.session) {
              await supabase
                .from("user_profiles")
                .upsert(
                  { id: authData.user.id, full_name: fullName },
                  { onConflict: "id" },
                )
                .then(function () {})
                .catch(function () {});
            }
            btnSignUp.disabled = false;
            btnSignUp.textContent = "Create Account";

            if (authData.session) {
              showMessage("✅ Account created! Redirecting...", "success");
              setTimeout(function () {
                window.location.href = "/app";
              }, 800);
            } else {
              showMessage(
                "📧 Account created! Check your email to confirm your account.",
                "success",
              );
            }
          }
        });

        signinForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          hideMessage();
          const email = document.getElementById("signinEmail").value.trim();
          const password = document.getElementById("signinPassword").value;

          if (!email || !password) {
            showMessage("Please fill in all fields.", "error");
            return;
          }

          btnSignIn.disabled = true;
          btnSignIn.textContent = "Signing in...";
          showMessage("Signing in...", "info");

          const { error } = await supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            showMessage(error.message, "error");
            btnSignIn.disabled = false;
            btnSignIn.textContent = "Sign In";
            return;
          }

          showMessage("✅ Signed in successfully!", "success");
          setTimeout(function () {
            window.location.href = "/app";
          }, 600);
        });

        btnGoogle.addEventListener("click", async () => {
          hideMessage();
          showMessage("Redirecting to Google...", "info");
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: window.location.origin + "/app" },
          });
          if (error) {
            showMessage("Google sign-in failed: " + error.message, "error");
          }
        });

        // Always show the login screen first — no auto-redirect, even if already signed in.
      })();
    </script>
  </body>
</html>
